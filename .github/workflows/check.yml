name: Check Senko
on:
  pull_request:
  push:
    branches: [main, feature/offline-senko-dialogues]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m py_compile bot.py senko_dialogue.py test_senko_dialogue.py
      - run: python -m unittest -v test_senko_dialogue.py
